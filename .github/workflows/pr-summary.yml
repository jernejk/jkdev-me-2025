name: AI PR Summary

# Posts (and updates) a sticky AI-generated summary on PRs using GitHub Models.
# No API keys needed — uses GITHUB_TOKEN + the `models: read` permission.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ai-pr-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summarize:
    # Skip bot PRs and opt-out via "[skip ai]" in the PR title.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.title, '[skip ai]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai
          gh pr diff "$PR_NUMBER" > /tmp/ai/full.diff || true
          MAX=12000
          SIZE=$(wc -c < /tmp/ai/full.diff | tr -d ' ')
          if [ "$SIZE" -gt "$MAX" ]; then
            head -c "$MAX" /tmp/ai/full.diff > /tmp/ai/diff.txt
            printf '\n\n[diff truncated: %s of %s bytes shown]\n' "$MAX" "$SIZE" >> /tmp/ai/diff.txt
            echo "truncated=true" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/ai/full.diff /tmp/ai/diff.txt
            echo "truncated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build prompt
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          {
            echo "Pull request title: ${PR_TITLE}"
            echo
            echo "Pull request description:"
            echo "${PR_BODY:-(empty)}"
            echo
            echo "Unified diff:"
            echo '```diff'
            cat /tmp/ai/diff.txt
            echo '```'
          } > /tmp/ai/prompt.txt

      - name: Run AI inference
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          max-tokens: 600
          system-prompt: |
            You are a senior code reviewer summarising a GitHub pull request for the maintainer.
            Output GitHub-flavoured Markdown only, with exactly these sections in order:

            **TL;DR:** one sentence, no preamble.

            **What changed**
            - 3 to 6 short bullet points describing concrete changes.

            **Reviewer notes**
            - 0 to 4 bullets calling out risks, follow-ups, or things to double-check. Omit the section entirely if nothing notable.

            Rules:
            - Be specific (mention files/functions) but concise.
            - Do not invent changes that are not in the diff.
            - Do not include code fences or restate the diff.
          prompt-file: /tmp/ai/prompt.txt

      - name: Post or update sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
        run: |
          set -euo pipefail
          MARKER='<!-- ai-pr-summary -->'
          {
            echo "$MARKER"
            echo "## 🤖 AI PR summary"
            echo
            echo "$AI_RESPONSE"
            echo
            if [ "$TRUNCATED" = "true" ]; then
              echo "<sub>Diff was truncated before summarisation.</sub>"
            fi
            echo "<sub>Generated by \`openai/gpt-4o-mini\` via GitHub Models. Add \`[skip ai]\` to the PR title to disable.</sub>"
          } > /tmp/ai/comment.md

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -F body=@/tmp/ai/comment.md > /dev/null
            echo "Updated comment $EXISTING"
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/ai/comment.md
            echo "Posted new comment"
          fi
