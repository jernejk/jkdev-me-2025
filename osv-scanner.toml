# osv-scanner ignore list for the pre-push dependency gate
# (scripts/security/pre-push-dependency-scan.sh).
#
# Only Medium-severity advisories in build/observability tooling that cannot be
# fixed without a disproportionate major upgrade are listed here. Trivy still
# enforces zero fixable HIGH/CRITICAL with no ignores. Each entry has a review
# date so these don't silently rot — revisit when the upstream majors land.

[[IgnoredVulns]]
id = "GHSA-8988-4f7v-96qf"
ignoreUntil = 2026-09-18
reason = "@opentelemetry/core 1.30.1 (Medium 5.3). Fix is otel 2.x. The stack is pulled by @contentlayer2/utils 0.5.8 via @opentelemetry/sdk-trace-node ^1.30.1 — not @sentry/node, which is no longer a dependency. propagator-jaeger is already forced to 2.x via resolutions and the production build passes; core has not been moved yet. Build-time/observability only; no untrusted input path on a static site."

# --- No released fix upstream. Trivy runs with --ignore-unfixed so it does not
# flag these; osv-scanner has no equivalent flag, so they are listed here to
# keep the pre-push gate meaningful rather than permanently red.

