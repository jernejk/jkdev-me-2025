ignoreUntil = 2026-09-18
reason = "js-yaml 3.14.2 (Medium 5.3). Fix is 4.x, but js-yaml 4 removed safeLoad and is pulled transitively by gray-matter 4.0.3 and @lhci/utils — forcing 4.x breaks them. The 4.1.1 line is already bumped to 4.2.0; only the 3.x transitive remains. Build-time only; we parse our own trusted frontmatter."
